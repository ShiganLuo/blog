server {
    listen       80; # 或者你在 Docker 内部监听的端口
    server_name  shiganluo.top;

    # SEO: robots.txt 和 sitemap.xml 代理到后端，不走 SPA fallback
    location = /robots.txt {
        proxy_pass http://blog_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://blog_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 0. 发版防呆：index.html 禁止缓存（否则浏览器继续用旧 HTML 引用已下线的旧资源哈希）
    location = /index.html {
        root   /usr/share/nginx/front/html;
        add_header Cache-Control "no-cache";
    }

    # 0.1 带哈希的构建产物可长缓存
    location /assets/ {
        root   /usr/share/nginx/front/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 1. 前端静态文件
    location / {
        root   /usr/share/nginx/front/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 关键：将所有 /api 开头的请求转发给后端容器
    location /api/ {
        # 注意：这里用后端在 Docker Compose 里的服务名，这是容器间通信，云服务器厂商可能默认禁止内部回环访问
        proxy_pass http://blog_backend:8080; 
        
        # 必须使用合法的 Host header，Tomcat 10+ 不接受包含下划线的 hostname
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
