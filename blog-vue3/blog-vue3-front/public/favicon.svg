<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D87FF"/>
      <stop offset="100%" style="stop-color:#4A6FE0"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 书本/日记本图标 -->
  <g transform="translate(14, 10)">
    <!-- 书页 -->
    <rect x="4" y="6" width="28" height="38" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- 书脊线 -->
    <line x1="12" y1="6" x2="12" y2="44" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <!-- 文字行 -->
    <line x1="17" y1="16" x2="27" y2="16" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="17" y1="22" x2="27" y2="22" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="17" y1="28" x2="24" y2="28" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
